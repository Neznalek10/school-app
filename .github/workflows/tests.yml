# Continuous integration: runs the Python and JavaScript test suites on every push and pull request.
# The JavaScript suite runs under gjs, the same runtime it is verified with locally (see tools/test.sh).
name: tests

on:
  push:
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs

      - name: Run the Python tests
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v

      - name: Run the JavaScript tests
        run: gjs -m tests/js/run.mjs
