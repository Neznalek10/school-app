<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>School</title>
  <meta name="description" content="Subjects, notes, AI tutors and language practice in one place.">
  <meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="./css/app.css">
  <script src="./version.js"></script>
  <script type="module" src="./js/app.js"></script>
  <!-- Sync: keeps browser data in the local data file while the server runs. Non-blocking, so the app loads without it. -->
  <script type="module" src="./js/sync/page.js"></script>
</head>
<body>
  <div class="app">
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div class="page">
      <header class="topbar" id="topbar"></header>
      <main id="view">
        <div class="loading" aria-label="Loading"><span></span><span></span><span></span></div>
      </main>
    </div>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</body>
</html>
